name: Update platform stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats.json from BioInfoJobs / News / Uni
        run: python scripts/generate_stats.py

      - name: Commit updated stats.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "No stat changes — skipping commit"
            exit 0
          fi
          git commit -m "📊 Update platform stats $(date +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push origin main
